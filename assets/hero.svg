<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Mohamed H. Eldesouky, Backend Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#151a3a"/><stop offset="1" stop-color="#2a1b4d"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ecbff"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
  <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0.28"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>
  <style>
    .draw { stroke-dasharray: 600; animation: draw 2.4s ease backwards; }
    .d2 { animation-delay: .6s; } .d3 { animation-delay: 1.1s; } .d4 { animation-delay: 1.6s; }
    @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
    .node { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .n2 { animation-delay: .5s; } .n3 { animation-delay: 1s; } .n4 { animation-delay: 1.5s; } .n5 { animation-delay: 2s; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    .fade { animation: fade 1s ease .3s backwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<rect width="1000" height="300" rx="18" fill="url(#grid)"/>
<rect width="1000" height="300" rx="18" fill="url(#glow)"/>

<!-- branch graph -->
<g transform="translate(135,21) scale(0.86)">
<g fill="none" stroke-width="4" stroke-linecap="round">
  <path class="draw" d="M600 150 H960" stroke="#58a6ff"/>
  <path class="draw d2" d="M680 150 C 710 150 710 80 750 80 H840 C 870 80 870 150 900 150" stroke="#a371f7"/>
  <path class="draw d3" d="M720 150 C 750 150 750 225 790 225 H870 C 900 225 900 150 930 150" stroke="#3fb950"/>
  <path class="draw d4" d="M780 80 C 800 80 800 40 830 40 H880" stroke="#f0883e"/>
</g>
<g stroke="#0b1220" stroke-width="3">
  <circle class="node" cx="620" cy="150" r="8" fill="#58a6ff"/>
  <circle class="node n2" cx="680" cy="150" r="8" fill="#58a6ff"/>
  <circle class="node n3" cx="750" cy="80" r="8" fill="#a371f7"/>
  <circle class="node n4" cx="840" cy="80" r="8" fill="#a371f7"/>
  <circle class="node n5" cx="790" cy="225" r="8" fill="#3fb950"/>
  <circle class="node n2" cx="870" cy="225" r="8" fill="#3fb950"/>
  <circle class="node n3" cx="830" cy="40" r="7" fill="#f0883e"/>
  <circle class="node n4" cx="900" cy="150" r="8" fill="#58a6ff"/>
  <circle class="node n5" cx="960" cy="150" r="10" fill="#ffffff"/>
</g>
<text x="595" y="188" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#58a6ff" fill-opacity="0.8">main</text>
<text x="740" y="108" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#a371f7" fill-opacity="0.9">feature/api</text>
<text x="790" y="256" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12" fill="#3fb950" fill-opacity="0.9">feature/ef-core</text>

</g>
<g class="fade">
  <g transform="translate(78,62) scale(1.1)" stroke="#58a6ff" stroke-width="3" fill="none" stroke-linecap="round">
  <line x1="0" y1="-14" x2="0" y2="14"/>
  <path d="M0 4 C0 -6 14 -2 14 -12"/>
  <circle cx="0" cy="-14" r="5" fill="#0d1117"/>
  <circle cx="0" cy="14" r="5" fill="#0d1117"/>
  <circle cx="14" cy="-12" r="5" fill="#0d1117"/>
</g>
  <text x="108" y="68" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#8b949e" letter-spacing="2">EVA PHARMA</text>
  <text x="60" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="43" font-weight="800" fill="url(#name)">Mohamed H. Eldesouky</text>
  <text x="62" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#c9d1d9">Backend Engineer  &#183;  Technical Project Coordinator</text>
  <g transform="translate(60,200)">
  <rect width="66" height="32" rx="16" fill="#a371f7" fill-opacity="0.14" stroke="#a371f7" stroke-opacity="0.7"/>
  <text x="33.0" y="21" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#a371f7">.NET</text>
</g><g transform="translate(138,200)">
  <rect width="48" height="32" rx="16" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.7"/>
  <text x="24.0" y="21" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#3fb950">C#</text>
</g><g transform="translate(198,200)">
  <rect width="138" height="32" rx="16" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.7"/>
  <text x="69.0" y="21" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#58a6ff">ASP.NET Core</text>
</g><g transform="translate(348,200)">
  <rect width="93" height="32" rx="16" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.7"/>
  <text x="46.5" y="21" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#f0883e">EF Core</text>
</g><g transform="translate(453,200)">
  <rect width="120" height="32" rx="16" fill="#f778ba" fill-opacity="0.14" stroke="#f778ba" stroke-opacity="0.7"/>
  <text x="60.0" y="21" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#f778ba">SQL Server</text>
</g>
</g>
</svg>